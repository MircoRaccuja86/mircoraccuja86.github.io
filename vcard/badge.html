<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<title>Il mio badge</title>
<meta name="theme-color" content="#9E150F">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="manifest" id="manifestLink">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --accent: #9E150F;
    --accent-dark: #7C110C;
    --ink: #111111;
    --text: #424242;
    --muted: #767676;
    --page: #F1F0F0;
    --border: #C4C5C6;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color: transparent;}
  html,body{margin:0;padding:0; height:100%;}
  body{
    background: var(--page);
    color: var(--text);
    font-family: 'Roboto', Arial, sans-serif;
    min-height: 100vh;
    display:flex;
    flex-direction: column;
    -webkit-user-select:none; user-select:none;
  }
  .band{
    background: var(--accent);
    color: #fff;
    padding: max(22px, env(safe-area-inset-top)) 24px 20px;
    text-align:center;
  }
  .band .eyebrow{
    font-size: 11px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    opacity: 0.88;
    margin: 0;
    font-weight:500;
  }
  #app{ flex:1; width:100%; max-width: 420px; margin:0 auto; text-align:center; padding: 32px 24px 24px; display:flex; flex-direction:column; align-items:center; justify-content:center; }
  .state{ text-align:center; color: var(--muted); font-size:14.5px; }

  h1{ font-size: 28px; font-weight: 500; line-height: 1.2; margin: 0 0 4px; color: var(--ink); letter-spacing:-0.01em; }
  .title{ font-size: 14px; color: var(--muted); margin: 0 0 28px; }

  .qr-frame{
    background:#fff;
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 22px;
    display:inline-block;
  }
  .hint{
    margin-top: 20px;
    font-size: 12.5px;
    color: var(--muted);
  }
</style>
</head>
<body>
<div class="band"><p class="eyebrow">Badge digitale</p></div>
<div id="app"><p class="state">Caricamento…</p></div>

<script>
const params = new URLSearchParams(window.location.search);
const id = params.get('id') || '';

const manifest = {
  name: 'Badge digitale studio',
  short_name: 'Badge',
  start_url: new URL(id ? ('badge.html?id=' + encodeURIComponent(id)) : 'badge.html', window.location.href).toString(),
  scope: new URL('.', window.location.href).toString(),
  display: 'standalone',
  background_color: '#F1F0F0',
  theme_color: '#9E150F',
  icons: [
    { src: new URL('icons/icon-192.png', window.location.href).toString(), sizes: '192x192', type: 'image/png' },
    { src: new URL('icons/icon-512.png', window.location.href).toString(), sizes: '512x512', type: 'image/png' }
  ]
};
document.getElementById('manifestLink').setAttribute(
  'href',
  URL.createObjectURL(new Blob([JSON.stringify(manifest)], { type: 'application/json' }))
);

if('serviceWorker' in navigator){
  navigator.serviceWorker.register('sw.js').catch(() => {});
}

async function init(){
  const app = document.getElementById('app');

  if(!id){
    app.innerHTML = '<p class="state">Nessun contatto specificato nell\'indirizzo (manca ?id=...).</p>';
    return;
  }

  let data;
  try{
    const res = await fetch('contacts.json', {cache:'no-store'});
    data = await res.json();
  }catch(e){
    app.innerHTML = '<p class="state">Impossibile caricare i dati. Controlla la connessione e riapri l\'app.</p>';
    return;
  }

  const c = data.contacts.find(x => x.id === id);
  if(!c || c.active === false){
    app.innerHTML = '<p class="state">Questo contatto non è al momento disponibile.</p>';
    return;
  }

  const contactUrl = new URL('index.html?id=' + encodeURIComponent(id), window.location.href).toString();

  app.innerHTML = `
    <h1>${c.name}</h1>
    ${c.title ? `<p class="title">${c.title}</p>` : ''}
    <div class="qr-frame" id="qrHolder"></div>
    <p class="hint">Fai inquadrare questo codice per condividere il tuo contatto</p>
  `;

  new QRCode(document.getElementById('qrHolder'), {
    text: contactUrl,
    width: 220,
    height: 220,
    correctLevel: QRCode.CorrectLevel.M
  });
}

init();
</script>
</body>
</html>
