<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contatto</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink: #10233F;
    --ink-soft: #3C5169;
    --paper: #FDFCFA;
    --rule: #C9CDD3;
    --ledger-red: #7A2E2E;
    --gray: #6B7280;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background: var(--paper);
    background-image:
      linear-gradient(var(--paper), var(--paper)),
      repeating-linear-gradient(transparent, transparent 41px, rgba(16,35,63,0.045) 42px);
    color: var(--ink);
    font-family: 'Newsreader', serif;
    min-height: 100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding: 24px;
  }
  #app{ width:100%; max-width: 480px; }
  .state{ text-align:center; font-family:'IBM Plex Mono', monospace; color: var(--gray); font-size:14px; }

  .card{
    background: var(--paper);
    border: 1px solid var(--rule);
    padding: 40px 36px 32px;
    position: relative;
  }
  .card::before{
    content:"";
    position:absolute; top:10px; left:10px; right:10px; bottom:10px;
    border: 1px solid var(--rule);
    pointer-events:none;
  }
  .eyebrow{
    font-family:'IBM Plex Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--ledger-red);
    margin: 0 0 6px;
  }
  h1{
    font-size: 34px;
    font-weight: 600;
    line-height: 1.15;
    margin: 0 0 4px;
    color: var(--ink);
  }
  .title{
    font-family:'IBM Plex Mono', monospace;
    font-size: 13px;
    color: var(--ink-soft);
    margin: 0 0 28px;
  }
  .quick-actions{
    display:flex;
    justify-content:center;
    gap: 16px;
    margin: 0 0 30px;
  }
  .icon-btn{
    display:flex;
    align-items:center;
    justify-content:center;
    width: 48px;
    height: 48px;
    border-radius: 50%;
    background: var(--ink);
    color: var(--paper);
    text-decoration:none;
    transition: background 0.15s ease;
  }
  .icon-btn:hover{ background: var(--ledger-red); }
  .icon-btn svg{ width: 20px; height: 20px; }

  .actions{ display:flex; flex-direction:column; gap: 10px; }
  button.primary{
    font-family:'IBM Plex Mono', monospace;
    font-size: 13px;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    background: var(--ink);
    color: var(--paper);
    border: none;
    padding: 15px 20px;
    cursor: pointer;
    transition: background 0.15s ease;
  }
  button.primary:hover{ background: var(--ledger-red); }
  button.primary:focus-visible{ outline: 2px solid var(--ledger-red); outline-offset: 2px; }

  .org{
    text-align:center;
    font-family:'IBM Plex Mono', monospace;
    font-size: 11px;
    color: var(--gray);
    margin-top: 22px;
    letter-spacing: 0.04em;
  }

  @media (prefers-reduced-motion: no-preference){
    .card{ animation: rise 0.5s ease both; }
  }
  @keyframes rise{ from{ opacity:0; transform: translateY(8px);} to{ opacity:1; transform:none; } }
</style>
</head>
<body>
<div id="app"><p class="state">Caricamento contatto…</p></div>

<script>
async function init(){
  const app = document.getElementById('app');
  const params = new URLSearchParams(window.location.search);
  const id = params.get('id');

  if(!id){
    app.innerHTML = '<p class="state">Nessun contatto specificato nell\'indirizzo (manca ?id=...).</p>';
    return;
  }

  let data;
  try{
    const res = await fetch('contacts.json', {cache:'no-store'});
    data = await res.json();
  }catch(e){
    app.innerHTML = '<p class="state">Impossibile caricare i dati dei contatti.</p>';
    return;
  }

  const c = data.contacts.find(x => x.id === id);
  if(!c){
    app.innerHTML = '<p class="state">Contatto non trovato: "' + id.replace(/</g,'') + '".</p>';
    return;
  }
  if(c.active === false){
    app.innerHTML = '<p class="state">Questo contatto non è al momento disponibile.</p>';
    return;
  }

  const icons = {
    phone: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0 1 22 16.92z"/></svg>',
    mail: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16v16H4z"/><path d="m22 6-10 7L2 6"/></svg>',
    map: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0z"/><circle cx="12" cy="10" r="3"/></svg>'
  };

  const quickActions = [];
  if(c.mobile)  quickActions.push(`<a class="icon-btn" href="tel:${c.mobile.replace(/\s/g,'')}" aria-label="Chiama">${icons.phone}</a>`);
  if(c.email)   quickActions.push(`<a class="icon-btn" href="mailto:${c.email}" aria-label="Invia email">${icons.mail}</a>`);
  if(c.address) quickActions.push(`<a class="icon-btn" href="https://www.google.com/maps/dir/?api=1&destination=${encodeURIComponent(c.address)}" target="_blank" rel="noopener" aria-label="Apri indicazioni stradali">${icons.map}</a>`);

  app.innerHTML = `
    <div class="card">
      <p class="eyebrow">Biglietto da visita digitale</p>
      <h1>${c.name}</h1>
      ${c.title ? `<p class="title">${c.title}</p>` : ''}
      ${quickActions.length ? `<div class="quick-actions">${quickActions.join('')}</div>` : ''}
      <div class="actions">
        <button class="primary" id="saveBtn">Salva contatto</button>
      </div>
      ${data.org ? `<p class="org">${data.org}</p>` : ''}
    </div>
  `;

  document.getElementById('saveBtn').addEventListener('click', () => downloadVCard(c, data.org));
}

function downloadVCard(c, org){
  const lines = [
    'BEGIN:VCARD',
    'VERSION:3.0',
    `FN:${c.name}`,
    org ? `ORG:${org}` : '',
    c.title ? `TITLE:${c.title}` : '',
    c.mobile ? `TEL;TYPE=CELL:${c.mobile}` : '',
    c.phone ? `TEL;TYPE=WORK:${c.phone}` : '',
    c.email ? `EMAIL:${c.email}` : '',
    c.address ? `ADR;TYPE=WORK:;;${c.address}` : '',
    'END:VCARD'
  ].filter(Boolean).join('\r\n');

  const blob = new Blob([lines], {type:'text/vcard'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = c.name.replace(/\s+/g,'_') + '.vcf';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

init();
</script>
</body>
</html>
